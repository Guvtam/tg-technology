name: Support integration tests
on:
  push:
    branches: [feature/soporte-api-integration]
  pull_request:
    branches: [main]
jobs:
  test-support:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'Django==6.0.7' 'whitenoise>=6.9,<7'
      - name: Run Django tests
        run: python manage.py test core
